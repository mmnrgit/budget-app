<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Budget">
<meta name="theme-color" content="#1D9E75">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Mon Budget</title>
<style>
  :root {
    --bg: #F7F6F2;
    --card: #FFFFFF;
    --border: #E4E2DA;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-tertiary: #888780;
    --green: #639922;
    --green-bg: #EAF3DE;
    --amber: #BA7517;
    --amber-bg: #FAEEDA;
    --red: #A32D2D;
    --red-bg: #FCEBEB;
    --accent: #1D9E75;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1F26;
      --card: #262A33;
      --border: #3A3F4A;
      --text: #F1EFE8;
      --text-secondary: #B4B2A9;
      --text-tertiary: #888780;
      --green: #97C459;
      --green-bg: #27500A;
      --amber: #FAC775;
      --amber-bg: #633806;
      --red: #F09595;
      --red-bg: #501313;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0 8px;
  }
  .header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .week-nav { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .week-nav button.nav-arrow {
    border: none; background: none; padding: 2px 4px; font-size: 16px;
    color: var(--text-secondary); line-height: 1;
  }
  .week-nav p { font-size: 13px; color: var(--text-secondary); margin: 0; min-width: 110px; text-align: center; }
  button {
    font-family: inherit;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
  }
  button.icon-btn {
    border: none; background: none; font-size: 18px; padding: 4px 6px; color: var(--text-secondary);
  }
  .cats { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 20px; }
  .cat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .cat-row {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    font-size: 14px;
  }
  .cat-row .label { display: flex; align-items: center; gap: 8px; }
  .cat-row .amounts { font-weight: 600; }
  .cat-row .amounts .total { color: var(--text-tertiary); font-weight: 400; }
  .bar-bg { height: 8px; border-radius: 6px; background: var(--bg); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
  .alert { font-size: 12px; margin: 6px 0 0; }
  .form-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .form-card p { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  select, input {
    font-family: inherit;
    font-size: 15px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }
  .row { display: flex; gap: 8px; }
  .history { margin: 20px 0 30px; }
  .history p.title { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .hist-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px;
    cursor: pointer;
  }
  .hist-item .left { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
  .hist-item .amount { font-weight: 600; color: var(--text); }
  .hist-item .delete { font-size: 18px; color: var(--text-tertiary); padding: 0 4px; cursor: pointer; }
  .empty { font-size: 13px; color: var(--text-tertiary); text-align: center; padding: 12px 0; }
  .icon { font-size: 18px; }
  .edit-row { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 10px; }
  .edit-row .row { gap: 6px; }
  .edit-row .row2 { display: flex; gap: 6px; margin-top: 4px; }
  .settings-panel { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 20px; }
  .settings-cat { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .settings-cat input.icon-input { width: 50px; flex: none; text-align: center; padding: 8px; }
  .settings-cat input.label-input { flex: 1.6; }
  .settings-cat input.budget-input { flex: 1; }
  .settings-cat .remove { font-size: 18px; color: var(--text-tertiary); cursor: pointer; padding: 0 2px; }
  .add-cat { display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 12px; }
  .toggle-link { font-size: 13px; color: var(--accent); text-align: center; padding: 8px 0; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Mon budget</h1>
    <div class="week-nav">
      <button class="nav-arrow" id="prev-week">←</button>
      <p id="week-range"></p>
      <button class="nav-arrow" id="next-week">→</button>
    </div>
  </div>
  <button class="icon-btn" id="settings-btn" title="Catégories">⚙️</button>
</div>

<div id="cats" class="cats"></div>

<div id="settings" class="settings-panel" style="display:none"></div>

<div class="form-card">
  <p>Ajouter une dépense</p>
  <div class="row">
    <select id="cat-select" style="flex:1.4"></select>
    <input id="amount-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="€" style="flex:1" />
  </div>
  <input id="note-input" type="text" placeholder="Note (optionnel)" />
  <button id="add-btn" class="primary">Ajouter</button>
</div>

<div id="history" class="history"></div>

<div class="toggle-link" id="reset-btn">Réinitialiser cette semaine</div>

<script>
const DEFAULT_CATS = [
  { id:'sorties', label:'Sorties & plaisirs', icon:'🎉', weekly:68 },
  { id:'essence', label:'Essence', icon:'⛽', weekly:46 },
  { id:'courses', label:'Courses', icon:'🛒', weekly:23 },
  { id:'clopes', label:'Cigarettes', icon:'🚬', weekly:24 }
];

let CATS = JSON.parse(localStorage.getItem('categories') || 'null') || DEFAULT_CATS;
let weekOffset = 0;
let entries = [];
let editingIdx = null;

function getMonday(d, offset=0){
  const date = new Date(d);
  const day = (date.getDay()+6)%7;
  date.setDate(date.getDate() - day + offset*7);
  date.setHours(0,0,0,0);
  return date;
}

function storageKeyFor(monday){
  const y = monday.getFullYear();
  const m = String(monday.getMonth()+1).padStart(2,'0');
  const d = String(monday.getDate()).padStart(2,'0');
  return 'expenses-' + y + '-' + m + '-' + d;
}

function weekRangeLabel(monday){
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmt = x => x.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  return fmt(monday) + ' – ' + fmt(sunday);
}

function colorFor(ratio){
  if(ratio < 0.7) return 'var(--green)';
  if(ratio < 1) return 'var(--amber)';
  return 'var(--red)';
}

function currentMonday(){
  return getMonday(new Date(), weekOffset);
}

function loadEntries(){
  const key = storageKeyFor(currentMonday());
  entries = JSON.parse(localStorage.getItem(key) || '[]');
}

function saveEntries(){
  const key = storageKeyFor(currentMonday());
  localStorage.setItem(key, JSON.stringify(entries));
}

function saveCats(){
  localStorage.setItem('categories', JSON.stringify(CATS));
}

function populateSelect(){
  const select = document.getElementById('cat-select');
  const prev = select.value;
  select.innerHTML = '';
  CATS.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.icon + ' ' + c.label;
    select.appendChild(opt);
  });
  if(CATS.find(c=>c.id===prev)) select.value = prev;
}

function renderWeekLabel(){
  document.getElementById('week-range').textContent = weekRangeLabel(currentMonday());
}

function renderCats(){
  const cats = document.getElementById('cats');
  cats.innerHTML = '';
  CATS.forEach(c=>{
    const spent = entries.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0);
    const ratio = c.weekly > 0 ? spent / c.weekly : 0;
    const col = colorFor(ratio);
    const pct = Math.min(100, Math.round(ratio*100));
    const card = document.createElement('div');
    card.className = 'cat-card';
    let alert = '';
    if(c.weekly > 0 && ratio>=1){
      alert = `<p class="alert" style="color:var(--red)">Budget dépassé de ${(spent-c.weekly).toFixed(0)}€</p>`;
    } else if(c.weekly > 0 && ratio>=0.7){
      alert = `<p class="alert" style="color:var(--amber)">Faut ralentir, plus que ${(c.weekly-spent).toFixed(0)}€</p>`;
    }
    card.innerHTML = `
      <div class="cat-row">
        <span class="label"><span class="icon">${c.icon}</span>${c.label}</span>
        <span class="amounts">${spent.toFixed(0)}€ <span class="total">/ ${c.weekly}€</span></span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
      ${alert}
    `;
    cats.appendChild(card);
  });
}

function renderHistory(){
  const hist = document.getElementById('history');
  if(entries.length===0){
    hist.innerHTML = '<p class="title">Cette semaine</p><div class="empty">Aucune dépense enregistrée</div>';
    return;
  }
  let html = '<p class="title">Cette semaine</p>';
  entries.forEach((e, i)=>{
    const c = CATS.find(x=>x.id===e.cat) || {icon:'❓', label:'?'};
    if(i === editingIdx){
      html += `
        <div class="edit-row">
          <div class="row">
            <select class="edit-cat" style="flex:1.4">${CATS.map(cc=>`<option value="${cc.id}" ${cc.id===e.cat?'selected':''}>${cc.icon} ${cc.label}</option>`).join('')}</select>
            <input class="edit-amount" type="number" inputmode="decimal" step="0.5" value="${e.amount}" style="flex:1" />
          </div>
          <input class="edit-note" type="text" placeholder="Note (optionnel)" value="${e.note ? e.note.replace(/"/g,'&quot;') : ''}" />
          <div class="row2">
            <button class="primary" style="flex:1;margin-top:0" data-action="save" data-idx="${i}">Enregistrer</button>
            <button style="flex:1" data-action="cancel">Annuler</button>
          </div>
        </div>`;
    } else {
      html += `<div class="hist-item" data-idx="${i}">
        <span class="left"><span class="icon">${c.icon}</span>${e.note ? e.note : c.label}</span>
        <span style="display:flex;align-items:center;gap:10px">
          <span class="amount">${e.amount.toFixed(2)}€</span>
          <span class="delete" data-idx="${i}">✕</span>
        </span>
      </div>`;
    }
  });
  hist.innerHTML = html;

  hist.querySelectorAll('.hist-item').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      if(ev.target.classList.contains('delete')) return;
      editingIdx = parseInt(el.dataset.idx);
      renderHistory();
    });
  });
  hist.querySelectorAll('.delete').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const idx = parseInt(el.dataset.idx);
      entries.splice(idx,1);
      if(editingIdx === idx) editingIdx = null;
      saveEntries();
      renderAll();
    });
  });
  const saveBtn = hist.querySelector('[data-action="save"]');
  if(saveBtn){
    saveBtn.addEventListener('click', ()=>{
      const idx = parseInt(saveBtn.dataset.idx);
      const row = saveBtn.closest('.edit-row');
      const cat = row.querySelector('.edit-cat').value;
      const amount = parseFloat(row.querySelector('.edit-amount').value);
      const note = row.querySelector('.edit-note').value.trim();
      if(!amount || amount<=0) return;
      entries[idx] = { ...entries[idx], cat, amount, note };
      editingIdx = null;
      saveEntries();
      renderAll();
    });
  }
  const cancelBtn = hist.querySelector('[data-action="cancel"]');
  if(cancelBtn){
    cancelBtn.addEventListener('click', ()=>{
      editingIdx = null;
      renderHistory();
    });
  }
}

function renderSettings(){
  const panel = document.getElementById('settings');
  let html = '';
  CATS.forEach((c, i)=>{
    html += `
      <div class="settings-cat">
        <input class="icon-input" data-idx="${i}" data-field="icon" value="${c.icon}" maxlength="2" />
        <input class="label-input" data-idx="${i}" data-field="label" value="${c.label.replace(/"/g,'&quot;')}" />
        <input class="budget-input" data-idx="${i}" data-field="weekly" type="number" inputmode="decimal" step="1" value="${c.weekly}" />
        <span class="remove" data-idx="${i}">🗑️</span>
      </div>`;
  });
  html += `
    <div class="add-cat">
      <p style="font-size:14px;font-weight:600;margin:0">Ajouter une catégorie</p>
      <div class="row">
        <input id="new-cat-icon" class="icon-input" placeholder="🎯" maxlength="2" style="width:50px;flex:none" />
        <input id="new-cat-label" placeholder="Nom" style="flex:1.6" />
        <input id="new-cat-budget" type="number" inputmode="decimal" placeholder="€/sem" style="flex:1" />
      </div>
      <button class="primary" id="add-cat-btn">Ajouter la catégorie</button>
    </div>
  `;
  panel.innerHTML = html;

  panel.querySelectorAll('input[data-idx]').forEach(input=>{
    input.addEventListener('change', ()=>{
      const idx = parseInt(input.dataset.idx);
      const field = input.dataset.field;
      if(field === 'weekly'){
        CATS[idx][field] = parseFloat(input.value) || 0;
      } else {
        CATS[idx][field] = input.value;
      }
      saveCats();
      populateSelect();
      renderCats();
      renderHistory();
    });
  });
  panel.querySelectorAll('.remove').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx);
      if(!confirm(`Supprimer "${CATS[idx].label}" ? Les dépenses déjà enregistrées dans cette catégorie resteront mais ne seront plus affichées.`)) return;
      CATS.splice(idx,1);
      saveCats();
      populateSelect();
      renderAll();
    });
  });
  document.getElementById('add-cat-btn').addEventListener('click', ()=>{
    const icon = document.getElementById('new-cat-icon').value.trim() || '💰';
    const label = document.getElementById('new-cat-label').value.trim();
    const weekly = parseFloat(document.getElementById('new-cat-budget').value) || 0;
    if(!label) return;
    const id = 'cat-' + Date.now();
    CATS.push({ id, label, icon, weekly });
    saveCats();
    populateSelect();
    renderAll();
  });
}

function renderAll(){
  renderWeekLabel();
  renderCats();
  renderHistory();
}

document.getElementById('prev-week').addEventListener('click', ()=>{
  weekOffset -= 1;
  editingIdx = null;
  loadEntries();
  renderAll();
});
document.getElementById('next-week').addEventListener('click', ()=>{
  weekOffset += 1;
  editingIdx = null;
  loadEntries();
  renderAll();
});

document.getElementById('settings-btn').addEventListener('click', ()=>{
  const panel = document.getElementById('settings');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    renderSettings();
  } else {
    panel.style.display = 'none';
  }
});

document.getElementById('add-btn').addEventListener('click', ()=>{
  const amount = parseFloat(document.getElementById('amount-input').value);
  if(!amount || amount<=0) return;
  const cat = document.getElementById('cat-select').value;
  const note = document.getElementById('note-input').value.trim();
  entries.push({cat, amount, note, ts: Date.now()});
  document.getElementById('amount-input').value = '';
  document.getElementById('note-input').value = '';
  saveEntries();
  renderAll();
});

document.getElementById('reset-btn').addEventListener('click', ()=>{
  if(confirm('Réinitialiser toutes les dépenses de cette semaine affichée ?')){
    entries = [];
    editingIdx = null;
    saveEntries();
    renderAll();
  }
});

populateSelect();
loadEntries();
renderAll();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
