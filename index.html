<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Budget">
<meta name="theme-color" content="#1D9E75">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Mon Budget</title>
<style>
  :root {
    --bg: #F7F6F2;
    --card: #FFFFFF;
    --border: #E4E2DA;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-tertiary: #888780;
    --green: #639922;
    --green-bg: #EAF3DE;
    --amber: #BA7517;
    --amber-bg: #FAEEDA;
    --red: #A32D2D;
    --red-bg: #FCEBEB;
    --accent: #1D9E75;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1F26;
      --card: #262A33;
      --border: #3A3F4A;
      --text: #F1EFE8;
      --text-secondary: #B4B2A9;
      --text-tertiary: #888780;
      --green: #97C459;
      --green-bg: #27500A;
      --amber: #FAC775;
      --amber-bg: #633806;
      --red: #F09595;
      --red-bg: #501313;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0 8px;
  }
  .header h1 { font-size: 18px; font-weight: 600; margin: 0; }

  .tabs {
    display: flex; gap: 6px; margin: 4px 0 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px;
  }
  .tab-btn {
    flex: 1; border: none; background: none; padding: 8px; border-radius: 9px;
    font-size: 14px; font-weight: 600; color: var(--text-secondary);
  }
  .tab-btn.active { background: var(--accent); color: white; }

  .nav-row { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 14px; }
  .nav-row button.nav-arrow {
    border: none; background: var(--card); border: 1px solid var(--border); width: 34px; height: 34px;
    border-radius: 10px; font-size: 16px; color: var(--text-secondary);
  }
  .nav-row .nav-label {
    font-size: 14px; font-weight: 600; min-width: 150px; text-align: center;
    position: relative;
  }
  .nav-row .nav-label input[type=date] {
    position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: none; padding: 0;
  }
  .today-link { font-size: 12px; color: var(--accent); text-align: center; margin: -8px 0 14px; cursor: pointer; }

  button {
    font-family: inherit;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
  }
  button.icon-btn {
    border: none; background: none; font-size: 18px; padding: 4px 6px; color: var(--text-secondary);
  }
  .cats { display: flex; flex-direction: column; gap: 10px; margin: 0 0 20px; }
  .cat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .cat-row {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    font-size: 14px;
  }
  .cat-row .label { display: flex; align-items: center; gap: 8px; }
  .cat-row .amounts { font-weight: 600; }
  .cat-row .amounts .total { color: var(--text-tertiary); font-weight: 400; }
  .bar-bg { height: 8px; border-radius: 6px; background: var(--bg); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
  .alert { font-size: 12px; margin: 6px 0 0; }
  .form-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
    margin-bottom: 16px;
  }
  .form-card p { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  select, input {
    font-family: inherit;
    font-size: 15px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }
  .row { display: flex; gap: 8px; }
  .history { margin: 0 0 30px; }
  .history p.title { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .hist-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px;
    cursor: pointer;
  }
  .hist-item .left { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
  .hist-item .amount { font-weight: 600; color: var(--text); }
  .hist-item .delete { font-size: 18px; color: var(--text-tertiary); padding: 0 4px; cursor: pointer; }
  .empty { font-size: 13px; color: var(--text-tertiary); text-align: center; padding: 12px 0; }
  .icon { font-size: 18px; }
  .edit-row { display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-radius: 10px; padding: 10px; margin: 4px 0; }
  .edit-row .row2 { display: flex; gap: 6px; margin-top: 4px; }
  .settings-panel { display: flex; flex-direction: column; gap: 10px; margin: 0 0 20px; }
  .settings-cat { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .settings-cat input.icon-input { width: 50px; flex: none; text-align: center; padding: 8px; }
  .settings-cat input.label-input { flex: 1.6; }
  .settings-cat input.budget-input { flex: 1; }
  .settings-cat .remove { font-size: 18px; color: var(--text-tertiary); cursor: pointer; padding: 0 2px; }
  .add-cat { display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 12px; }
  .toggle-link { font-size: 13px; color: var(--accent); text-align: center; padding: 8px 0 24px; cursor: pointer; }

  .allowance-card {
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .allowance-card .left-block p { margin: 0; }
  .allowance-card .label { font-size: 13px; opacity: 0.85; margin-bottom: 4px !important; }
  .allowance-card .amount-big { font-size: 32px; font-weight: 800; }
  .allowance-card .sub { font-size: 12px; opacity: 0.75; margin-top: 4px !important; }
  .allowance-card .emoji-block { font-size: 40px; }

  .summary-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .summary-card .title { font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; }
  .summary-card .big { font-size: 26px; font-weight: 700; margin: 0; }
  .summary-grid { display: flex; gap: 10px; margin-bottom: 12px; }
  .summary-grid .summary-card { flex: 1; margin-bottom: 0; }
  .income-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .income-item .left { color: var(--text-secondary); display:flex; align-items:center; gap:8px; }
  .income-item .amount { font-weight: 600; color: var(--green); }
  .chart-wrap { overflow-x: auto; }
  .section-title { font-size: 15px; font-weight: 600; margin: 18px 0 8px; }

  #pull-indicator {
    position: fixed; top: 0; left: 0; right: 0; height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--text-secondary); transition: height 0.15s;
    z-index: 999; background: var(--bg);
  }
</style>
</head>
<body>
<div id="pull-indicator">↓ Tire pour rafraîchir</div>

<div class="header">
  <h1>Mon budget</h1>
  <div style="display:flex;gap:2px">
    <button class="icon-btn" id="settings-btn" title="Catégories">⚙️</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-track">Suivi</button>
  <button class="tab-btn" id="tab-overview">Résumé</button>
</div>

<!-- TRACK TAB -->
<div id="view-track">

  <div class="nav-row">
    <button class="nav-arrow" id="prev-week">←</button>
    <div class="nav-label" id="week-range-wrap">
      <span id="week-range"></span>
      <input type="date" id="week-date-picker" />
    </div>
    <button class="nav-arrow" id="next-week">→</button>
  </div>
  <div class="today-link" id="today-week-link">Revenir à cette semaine</div>

  <div id="settings" class="settings-panel" style="display:none"></div>

  <div id="allowance-card"></div>

  <div id="cats" class="cats"></div>

  <div class="form-card">
    <p>Ajouter une dépense</p>
    <div class="row">
      <select id="cat-select" style="flex:1.4"></select>
      <input id="amount-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="€" style="flex:1" />
    </div>
    <input id="note-input" type="text" placeholder="Note (optionnel)" />
    <button id="add-btn" class="primary">Ajouter</button>
  </div>

  <div id="history" class="history"></div>

  <div class="toggle-link" id="reset-btn">Réinitialiser cette semaine</div>
</div>

<!-- OVERVIEW TAB -->
<div id="view-overview" style="display:none">

  <div class="nav-row">
    <button class="nav-arrow" id="prev-month">←</button>
    <div class="nav-label" id="month-label"></div>
    <button class="nav-arrow" id="next-month">→</button>
  </div>

  <div class="summary-grid">
    <div class="summary-card">
      <p class="title">Revenus</p>
      <p class="big" id="sum-income" style="color:var(--green)"></p>
    </div>
    <div class="summary-card">
      <p class="title">Dépenses</p>
      <p class="big" id="sum-expenses"></p>
    </div>
  </div>
  <div class="summary-card">
    <p class="title">Solde du mois</p>
    <p class="big" id="sum-balance"></p>
    <div class="bar-bg" style="margin-top:8px"><div class="bar-fill" id="balance-bar"></div></div>
    <p class="alert" id="balance-alert" style="margin-top:8px"></p>
  </div>

  <div class="section-title">Revenus du mois</div>
  <div id="income-list"></div>
  <div class="form-card">
    <p>Ajouter un revenu (salaire, prime...)</p>
    <div class="row">
      <input id="income-amount" type="number" inputmode="decimal" min="0" step="1" placeholder="€" style="flex:1" />
      <input id="income-note" type="text" placeholder="Note (ex: Salaire)" style="flex:1.6" />
    </div>
    <button id="add-income-btn" class="primary">Ajouter</button>
  </div>

  <div class="section-title">Dépenses par catégorie</div>
  <div id="cat-breakdown" class="cats"></div>

  <div class="section-title">Tendance (8 dernières semaines)</div>
  <div class="summary-card chart-wrap">
    <svg id="trend-chart" width="100%" height="140" viewBox="0 0 320 140" preserveAspectRatio="none"></svg>
  </div>

  <div class="section-title">Objectif d'épargne</div>
  <div class="summary-card">
    <div class="row">
      <input id="savings-goal-input" type="number" inputmode="decimal" min="0" step="10" placeholder="€ par mois" style="flex:1" />
      <button id="save-goal-btn">Enregistrer</button>
    </div>
    <div class="bar-bg" style="margin-top:10px"><div class="bar-fill" id="goal-bar"></div></div>
    <p class="alert" id="goal-alert" style="margin-top:8px"></p>
  </div>

  <div style="height:20px"></div>
</div>

<script>
const DEFAULT_CATS = [
  { id:'sorties', label:'Sorties & plaisirs', icon:'🎉', weekly:68 },
  { id:'essence', label:'Essence', icon:'⛽', weekly:46 },
  { id:'courses', label:'Courses', icon:'🛒', weekly:23 },
  { id:'clopes', label:'Cigarettes', icon:'🚬', weekly:24 }
];

let CATS = JSON.parse(localStorage.getItem('categories') || 'null') || DEFAULT_CATS;
let weekOffset = 0;
let monthOffset = 0;
let entries = [];
let editingIdx = null;

/* ---------- date helpers ---------- */
function getMonday(d, offset=0){
  const date = new Date(d);
  const day = (date.getDay()+6)%7;
  date.setDate(date.getDate() - day + offset*7);
  date.setHours(0,0,0,0);
  return date;
}
function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function storageKeyFor(monday){ return 'expenses-' + isoDate(monday); }
function weekRangeLabel(monday){
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmt = x => x.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  return fmt(monday) + ' – ' + fmt(sunday);
}
function currentMonday(){ return getMonday(new Date(), weekOffset); }
function monthDate(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth() + monthOffset, 1);
}
function monthKey(d){ return 'income-' + d.getFullYear() + '-' + pad(d.getMonth()+1); }
function monthLabel(d){
  return d.toLocaleDateString('fr-FR',{month:'long', year:'numeric'});
}

/* ---------- storage ---------- */
function getFixedCharges(){ return JSON.parse(localStorage.getItem('fixedCharges') || '[]'); }
function saveFixedCharges(list){ localStorage.setItem('fixedCharges', JSON.stringify(list)); }

function getWeeklyAllowance(){
  // Always use the real current month for this card (independent of the Overview tab's monthOffset)
  const today = new Date();
  const realCurrentMonth = new Date(today.getFullYear(), today.getMonth(), 1);

  const incomes = getIncomes(realCurrentMonth);
  const totalIncome = incomes.reduce((s,e)=>s+e.amount, 0);
  const fixed = getFixedCharges().reduce((s,c)=>s+c.amount, 0);
  const disposable = totalIncome - fixed;

  // Money already spent this month (variable expenses only)
  const monthExpensesSoFar = getMonthExpenses(realCurrentMonth).reduce((s,e)=>s+e.amount, 0);
  const remainingBudget = disposable - monthExpensesSoFar;

  // Days left in the month, including today
  const lastDayOfMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  const daysLeftInMonth = lastDayOfMonth - today.getDate() + 1;
  const weeksLeftInMonth = Math.max(daysLeftInMonth / 7, 1/7);

  const weekly = remainingBudget > 0 ? remainingBudget / weeksLeftInMonth : 0;

  return { disposable, weekly, totalIncome, fixed, daysLeftInMonth };
}

function renderAllowanceCard(){
  const el = document.getElementById('allowance-card');
  const weeklySpent = entries.reduce((s,e)=>s+e.amount, 0);
  const { weekly, totalIncome, daysLeftInMonth } = getWeeklyAllowance();

  if(totalIncome === 0){
    el.innerHTML = `
      <div class="summary-card" style="margin-bottom:16px">
        <p style="font-size:13px;color:var(--text-secondary);margin:0">
          💡 Ajoute ton salaire dans l'onglet <strong>Résumé</strong> pour voir combien tu peux dépenser cette semaine.
        </p>
      </div>`;
    return;
  }

  const remaining = weekly - weeklySpent;
  const ratio = weekly > 0 ? weeklySpent / weekly : 1;
  let bg, color, emoji;
  if(ratio < 0.7){ bg = 'var(--green)'; color = 'white'; emoji = '😎'; }
  else if(ratio < 1){ bg = 'var(--amber)'; color = 'white'; emoji = '⚠️'; }
  else { bg = 'var(--red)'; color = 'white'; emoji = '🚨'; }

  const sign = remaining >= 0 ? '' : '-';
  el.innerHTML = `
    <div class="allowance-card" style="background:${bg};color:${color}">
      <div class="left-block">
        <p class="label">Budget semaine disponible</p>
        <p class="amount-big">${sign}${Math.abs(remaining).toFixed(0)}€</p>
        <p class="sub">Budget: ${weekly.toFixed(0)}€ · Dépensé: ${weeklySpent.toFixed(0)}€ · ${daysLeftInMonth}j restants ce mois</p>
      </div>
      <div class="emoji-block">${emoji}</div>
    </div>`;
}

function saveEntries(){ localStorage.setItem(storageKeyFor(currentMonday()), JSON.stringify(entries)); }
function loadEntries(){ entries = JSON.parse(localStorage.getItem(storageKeyFor(currentMonday())) || '[]'); }
function saveCats(){ localStorage.setItem('categories', JSON.stringify(CATS)); }
function getIncomes(d){ return JSON.parse(localStorage.getItem(monthKey(d)) || '[]'); }
function saveIncomes(d, list){ localStorage.setItem(monthKey(d), JSON.stringify(list)); }
function getGoal(){ return parseFloat(localStorage.getItem('savingsGoal') || '0'); }
function setGoal(v){ localStorage.setItem('savingsGoal', String(v)); }

/* every "expenses-*" entry whose ts falls within the given month */
function getMonthExpenses(d){
  const y = d.getFullYear(), m = d.getMonth();
  let all = [];
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(!key.startsWith('expenses-')) continue;
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    list.forEach(e=>{
      const dt = new Date(e.ts);
      if(dt.getFullYear()===y && dt.getMonth()===m) all.push(e);
    });
  }
  return all;
}

/* totals for the week starting at "monday" */
function getWeekTotal(monday){
  const list = JSON.parse(localStorage.getItem(storageKeyFor(monday)) || '[]');
  return list.reduce((s,e)=>s+e.amount,0);
}

/* ---------- colors ---------- */
function colorFor(ratio){
  if(ratio < 0.7) return 'var(--green)';
  if(ratio < 1) return 'var(--amber)';
  return 'var(--red)';
}

/* ============ TRACK TAB ============ */
function populateSelect(){
  const select = document.getElementById('cat-select');
  const prev = select.value;
  select.innerHTML = '';
  CATS.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.icon + ' ' + c.label;
    select.appendChild(opt);
  });
  if(CATS.find(c=>c.id===prev)) select.value = prev;
}

function renderWeekLabel(){
  document.getElementById('week-range').textContent = weekRangeLabel(currentMonday());
  document.getElementById('week-date-picker').value = isoDate(currentMonday());
  document.getElementById('today-week-link').style.display = weekOffset === 0 ? 'none' : 'block';
}

function renderCats(){
  const cats = document.getElementById('cats');
  cats.innerHTML = '';
  CATS.forEach(c=>{
    const spent = entries.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0);
    const ratio = c.weekly > 0 ? spent / c.weekly : 0;
    const col = colorFor(ratio);
    const pct = Math.min(100, Math.round(ratio*100));
    const card = document.createElement('div');
    card.className = 'cat-card';
    let alert = '';
    if(c.weekly > 0 && ratio>=1){
      alert = `<p class="alert" style="color:var(--red)">Budget dépassé de ${(spent-c.weekly).toFixed(0)}€</p>`;
    } else if(c.weekly > 0 && ratio>=0.7){
      alert = `<p class="alert" style="color:var(--amber)">Faut ralentir, plus que ${(c.weekly-spent).toFixed(0)}€</p>`;
    }
    card.innerHTML = `
      <div class="cat-row">
        <span class="label"><span class="icon">${c.icon}</span>${c.label}</span>
        <span class="amounts">${spent.toFixed(0)}€ <span class="total">/ ${c.weekly}€</span></span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
      ${alert}
    `;
    cats.appendChild(card);
  });
}

function renderHistory(){
  const hist = document.getElementById('history');
  if(entries.length===0){
    hist.innerHTML = '<p class="title">Cette semaine</p><div class="empty">Aucune dépense enregistrée</div>';
    return;
  }
  let html = '<p class="title">Cette semaine</p>';
  entries.forEach((e, i)=>{
    const c = CATS.find(x=>x.id===e.cat) || {icon:'❓', label:'?'};
    if(i === editingIdx){
      html += `
        <div class="edit-row">
          <div class="row">
            <select class="edit-cat" style="flex:1.4">${CATS.map(cc=>`<option value="${cc.id}" ${cc.id===e.cat?'selected':''}>${cc.icon} ${cc.label}</option>`).join('')}</select>
            <input class="edit-amount" type="number" inputmode="decimal" step="0.5" value="${e.amount}" style="flex:1" />
          </div>
          <input class="edit-note" type="text" placeholder="Note (optionnel)" value="${e.note ? e.note.replace(/"/g,'&quot;') : ''}" />
          <div class="row2">
            <button class="primary" style="flex:1;margin-top:0" data-action="save" data-idx="${i}">Enregistrer</button>
            <button style="flex:1" data-action="cancel">Annuler</button>
          </div>
        </div>`;
    } else {
      html += `<div class="hist-item" data-idx="${i}">
        <span class="left"><span class="icon">${c.icon}</span>${e.note ? e.note : c.label}</span>
        <span style="display:flex;align-items:center;gap:10px">
          <span class="amount">${e.amount.toFixed(2)}€</span>
          <span class="delete" data-idx="${i}">✕</span>
        </span>
      </div>`;
    }
  });
  hist.innerHTML = html;

  hist.querySelectorAll('.hist-item').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      if(ev.target.classList.contains('delete')) return;
      editingIdx = parseInt(el.dataset.idx);
      renderHistory();
    });
  });
  hist.querySelectorAll('.delete').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const idx = parseInt(el.dataset.idx);
      entries.splice(idx,1);
      if(editingIdx === idx) editingIdx = null;
      saveEntries();
      renderTrack();
    });
  });
  const saveBtn = hist.querySelector('[data-action="save"]');
  if(saveBtn){
    saveBtn.addEventListener('click', ()=>{
      const idx = parseInt(saveBtn.dataset.idx);
      const row = saveBtn.closest('.edit-row');
      const cat = row.querySelector('.edit-cat').value;
      const amount = parseFloat(row.querySelector('.edit-amount').value);
      const note = row.querySelector('.edit-note').value.trim();
      if(!amount || amount<=0) return;
      entries[idx] = { ...entries[idx], cat, amount, note };
      editingIdx = null;
      saveEntries();
      renderTrack();
    });
  }
  const cancelBtn = hist.querySelector('[data-action="cancel"]');
  if(cancelBtn){
    cancelBtn.addEventListener('click', ()=>{
      editingIdx = null;
      renderHistory();
    });
  }
}

function renderSettings(){
  const panel = document.getElementById('settings');
  const fixed = getFixedCharges();
  let html = '<p style="font-size:14px;font-weight:600;margin:0 0 6px">Catégories variables</p>';
  CATS.forEach((c, i)=>{
    html += `
      <div class="settings-cat">
        <input class="icon-input" data-idx="${i}" data-field="icon" value="${c.icon}" maxlength="2" />
        <input class="label-input" data-idx="${i}" data-field="label" value="${c.label.replace(/"/g,'&quot;')}" />
        <input class="budget-input" data-idx="${i}" data-field="weekly" type="number" inputmode="decimal" step="1" value="${c.weekly}" />
        <span class="remove" data-idx="${i}">🗑️</span>
      </div>`;
  });
  html += `
    <div class="add-cat">
      <p style="font-size:14px;font-weight:600;margin:0">Ajouter une catégorie</p>
      <div class="row">
        <input id="new-cat-icon" class="icon-input" placeholder="🎯" maxlength="2" style="width:50px;flex:none" />
        <input id="new-cat-label" placeholder="Nom" style="flex:1.6" />
        <input id="new-cat-budget" type="number" inputmode="decimal" placeholder="€/sem" style="flex:1" />
      </div>
      <button class="primary" id="add-cat-btn">Ajouter la catégorie</button>
    </div>
    <p style="font-size:14px;font-weight:600;margin:10px 0 6px">Charges fixes mensuelles</p>
    <p style="font-size:12px;color:var(--text-tertiary);margin:-2px 0 6px">Ces montants sont déduits de ton salaire pour calculer ton budget semaine.</p>
  `;
  fixed.forEach((f, i)=>{
    html += `
      <div class="settings-cat">
        <span style="font-size:20px">${f.icon||'💸'}</span>
        <input class="label-input" data-fidx="${i}" data-field="label" value="${f.label.replace(/"/g,'&quot;')}" />
        <input class="budget-input" data-fidx="${i}" data-field="amount" type="number" inputmode="decimal" step="1" value="${f.amount}" />
        <span class="remove" data-fidx="${i}">🗑️</span>
      </div>`;
  });
  html += `
    <div class="add-cat">
      <p style="font-size:14px;font-weight:600;margin:0">Ajouter une charge fixe</p>
      <div class="row">
        <input id="new-fixed-icon" class="icon-input" placeholder="🏠" maxlength="2" style="width:50px;flex:none" />
        <input id="new-fixed-label" placeholder="Ex: Loyer" style="flex:1.6" />
        <input id="new-fixed-amount" type="number" inputmode="decimal" placeholder="€/mois" style="flex:1" />
      </div>
      <button class="primary" id="add-fixed-btn">Ajouter la charge</button>
    </div>
  `;
  panel.innerHTML = html;

  panel.querySelectorAll('input[data-idx]').forEach(input=>{
    input.addEventListener('change', ()=>{
      const idx = parseInt(input.dataset.idx);
      const field = input.dataset.field;
      if(field === 'weekly'){
        CATS[idx][field] = parseFloat(input.value) || 0;
      } else {
        CATS[idx][field] = input.value;
      }
      saveCats();
      populateSelect();
      renderTrack();
    });
  });
  panel.querySelectorAll('.remove').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx);
      if(!confirm(`Supprimer "${CATS[idx].label}" ? Les dépenses déjà enregistrées dans cette catégorie resteront mais ne seront plus affichées.`)) return;
      CATS.splice(idx,1);
      saveCats();
      populateSelect();
      renderTrack();
    });
  });
  document.getElementById('add-cat-btn').addEventListener('click', ()=>{
    const icon = document.getElementById('new-cat-icon').value.trim() || '💰';
    const label = document.getElementById('new-cat-label').value.trim();
    const weekly = parseFloat(document.getElementById('new-cat-budget').value) || 0;
    if(!label) return;
    const id = 'cat-' + Date.now();
    CATS.push({ id, label, icon, weekly });
    saveCats();
    populateSelect();
    renderTrack();
  });

  // fixed charges events
  panel.querySelectorAll('input[data-fidx]').forEach(input=>{
    input.addEventListener('change', ()=>{
      const idx = parseInt(input.dataset.fidx);
      const field = input.dataset.field;
      const list = getFixedCharges();
      if(field === 'amount') list[idx][field] = parseFloat(input.value) || 0;
      else list[idx][field] = input.value;
      saveFixedCharges(list);
      renderAllowanceCard();
    });
  });
  panel.querySelectorAll('.remove[data-fidx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.fidx);
      const list = getFixedCharges();
      list.splice(idx,1);
      saveFixedCharges(list);
      renderSettings();
      renderAllowanceCard();
    });
  });
  document.getElementById('add-fixed-btn').addEventListener('click', ()=>{
    const icon = document.getElementById('new-fixed-icon').value.trim() || '💸';
    const label = document.getElementById('new-fixed-label').value.trim();
    const amount = parseFloat(document.getElementById('new-fixed-amount').value) || 0;
    if(!label || !amount) return;
    const list = getFixedCharges();
    list.push({ icon, label, amount });
    saveFixedCharges(list);
    renderSettings();
    renderAllowanceCard();
  });
}

function renderTrack(){
  renderWeekLabel();
  renderAllowanceCard();
  renderCats();
  renderHistory();
}

/* ============ OVERVIEW TAB ============ */
function renderOverview(){
  const md = monthDate();
  document.getElementById('month-label').textContent = monthLabel(md).replace(/^./, c=>c.toUpperCase());

  const incomes = getIncomes(md);
  const totalIncome = incomes.reduce((s,e)=>s+e.amount,0);
  const monthExpenses = getMonthExpenses(md);
  const totalVariableExpenses = monthExpenses.reduce((s,e)=>s+e.amount,0);
  const fixedTotal = getFixedCharges().reduce((s,c)=>s+c.amount,0);
  const totalExpenses = totalVariableExpenses + fixedTotal;
  const balance = totalIncome - totalExpenses;

  document.getElementById('sum-income').textContent = totalIncome.toFixed(0) + '€';
  document.getElementById('sum-expenses').textContent = totalExpenses.toFixed(0) + '€';
  const balEl = document.getElementById('sum-balance');
  balEl.textContent = (balance>=0?'+':'') + balance.toFixed(0) + '€';
  balEl.style.color = balance >= 0 ? 'var(--green)' : 'var(--red)';

  const balRatio = totalIncome > 0 ? Math.min(1, totalExpenses/totalIncome) : 0;
  document.getElementById('balance-bar').style.width = Math.round(balRatio*100) + '%';
  document.getElementById('balance-bar').style.background = colorFor(balRatio);
  const balAlert = document.getElementById('balance-alert');
  if(totalIncome === 0){
    balAlert.textContent = 'Ajoute ton salaire ci-dessous pour voir ton solde réel.';
    balAlert.style.color = 'var(--text-tertiary)';
  } else if(balance < 0){
    balAlert.textContent = `Tu es en négatif de ${Math.abs(balance).toFixed(0)}€ ce mois-ci.`;
    balAlert.style.color = 'var(--red)';
  } else {
    balAlert.textContent = `Il te reste ${balance.toFixed(0)}€ ce mois-ci.`;
    balAlert.style.color = 'var(--green)';
  }

  // income list
  const list = document.getElementById('income-list');
  if(incomes.length === 0){
    list.innerHTML = '<div class="empty">Aucun revenu enregistré ce mois</div>';
  } else {
    list.innerHTML = incomes.map((inc,i)=>`
      <div class="income-item">
        <span class="left">💶 ${inc.note || 'Revenu'}</span>
        <span style="display:flex;align-items:center;gap:10px">
          <span class="amount">+${inc.amount.toFixed(0)}€</span>
          <span class="delete" data-idx="${i}" style="font-size:18px;color:var(--text-tertiary);cursor:pointer">✕</span>
        </span>
      </div>`).join('');
    list.querySelectorAll('.delete').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = parseInt(el.dataset.idx);
        const updated = getIncomes(md);
        updated.splice(idx,1);
        saveIncomes(md, updated);
        renderOverview();
        renderAllowanceCard();
      });
    });
  }

  // category breakdown for the month
  const weeksInMonth = 30/7;
  const breakdown = document.getElementById('cat-breakdown');
  breakdown.innerHTML = '';
  CATS.forEach(c=>{
    const spent = monthExpenses.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0);
    const monthlyBudget = c.weekly * 4.345;
    const ratio = monthlyBudget > 0 ? spent/monthlyBudget : 0;
    const pct = Math.min(100, Math.round(ratio*100));
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `
      <div class="cat-row">
        <span class="label"><span class="icon">${c.icon}</span>${c.label}</span>
        <span class="amounts">${spent.toFixed(0)}€ <span class="total">/ ${monthlyBudget.toFixed(0)}€</span></span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${colorFor(ratio)}"></div></div>
    `;
    breakdown.appendChild(card);
  });

  renderTrendChart();

  // savings goal
  const goal = getGoal();
  document.getElementById('savings-goal-input').value = goal || '';
  const goalRatio = goal > 0 ? Math.min(1, Math.max(0, balance)/goal) : 0;
  document.getElementById('goal-bar').style.width = Math.round(goalRatio*100) + '%';
  document.getElementById('goal-bar').style.background = goalRatio >= 1 ? 'var(--green)' : (goalRatio >= 0.4 ? 'var(--amber)' : 'var(--red)');
  const goalAlert = document.getElementById('goal-alert');
  if(goal <= 0){
    goalAlert.textContent = "Définis un objectif d'épargne mensuel pour suivre ta progression.";
    goalAlert.style.color = 'var(--text-tertiary)';
  } else if(balance >= goal){
    goalAlert.textContent = `Objectif atteint ! Tu peux mettre ${Math.max(0,balance).toFixed(0)}€ de côté ce mois-ci 🎉`;
    goalAlert.style.color = 'var(--green)';
  } else {
    const remaining = goal - Math.max(0,balance);
    goalAlert.textContent = `Encore ${remaining.toFixed(0)}€ pour atteindre ton objectif de ${goal.toFixed(0)}€.`;
    goalAlert.style.color = 'var(--amber)';
  }
}

function renderTrendChart(){
  const svg = document.getElementById('trend-chart');
  const weeklyBudgetTotal = CATS.reduce((s,c)=>s+c.weekly,0);
  const weeks = [];
  for(let i=7;i>=0;i--){
    const monday = getMonday(new Date(), -i);
    weeks.push({ label: monday.toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'}), total: getWeekTotal(monday) });
  }
  const maxVal = Math.max(weeklyBudgetTotal, ...weeks.map(w=>w.total), 1);
  const W = 320, H = 140, padBottom = 20, padTop = 10;
  const barW = (W / weeks.length) * 0.55;
  const gap = (W / weeks.length);

  let svgContent = '';
  // budget reference line
  const budgetY = padTop + (H - padTop - padBottom) * (1 - weeklyBudgetTotal/maxVal);
  svgContent += `<line x1="0" y1="${budgetY}" x2="${W}" y2="${budgetY}" stroke="var(--text-tertiary)" stroke-width="1" stroke-dasharray="4,3" />`;

  weeks.forEach((w,i)=>{
    const barH = (H - padTop - padBottom) * (w.total/maxVal);
    const x = i*gap + (gap-barW)/2;
    const y = (H - padBottom) - barH;
    const col = w.total > weeklyBudgetTotal ? 'var(--red)' : 'var(--accent)';
    svgContent += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${col}" />`;
    svgContent += `<text x="${x + barW/2}" y="${H-6}" font-size="9" fill="var(--text-tertiary)" text-anchor="middle">${w.label}</text>`;
  });
  svg.innerHTML = svgContent;
}

/* ============ TAB SWITCHING ============ */
function switchTab(tab){
  document.getElementById('view-track').style.display = tab==='track' ? 'block' : 'none';
  document.getElementById('view-overview').style.display = tab==='overview' ? 'block' : 'none';
  document.getElementById('tab-track').classList.toggle('active', tab==='track');
  document.getElementById('tab-overview').classList.toggle('active', tab==='overview');
  document.getElementById('settings-btn').style.display = tab==='track' ? '' : 'none';
  if(tab==='overview') renderOverview();
  if(tab==='track') renderAllowanceCard();
}
document.getElementById('tab-track').addEventListener('click', ()=>switchTab('track'));
document.getElementById('tab-overview').addEventListener('click', ()=>switchTab('overview'));

/* ============ EVENTS: TRACK ============ */
document.getElementById('prev-week').addEventListener('click', ()=>{
  weekOffset -= 1; editingIdx = null; loadEntries(); renderTrack();
});
document.getElementById('next-week').addEventListener('click', ()=>{
  weekOffset += 1; editingIdx = null; loadEntries(); renderTrack();
});
document.getElementById('today-week-link').addEventListener('click', ()=>{
  weekOffset = 0; editingIdx = null; loadEntries(); renderTrack();
});
document.getElementById('week-date-picker').addEventListener('change', (e)=>{
  const picked = new Date(e.target.value + 'T00:00:00');
  const pickedMonday = getMonday(picked, 0);
  const thisMonday = getMonday(new Date(), 0);
  weekOffset = Math.round((pickedMonday - thisMonday) / (7*86400000));
  editingIdx = null; loadEntries(); renderTrack();
});

document.getElementById('settings-btn').addEventListener('click', ()=>{
  const panel = document.getElementById('settings');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    renderSettings();
  } else {
    panel.style.display = 'none';
  }
});

document.getElementById('add-btn').addEventListener('click', ()=>{
  const amount = parseFloat(document.getElementById('amount-input').value);
  if(!amount || amount<=0) return;
  const cat = document.getElementById('cat-select').value;
  const note = document.getElementById('note-input').value.trim();
  entries.push({cat, amount, note, ts: Date.now()});

  document.getElementById('note-input').value = '';

  renderTrack();
});

document.getElementById('reset-btn').addEventListener('click', ()=>{
  if(confirm('Réinitialiser toutes les dépenses de cette semaine affichée ?')){
    entries = [];
    editingIdx = null;
    saveEntries();
    renderTrack();
  }
});

/* ============ EVENTS: OVERVIEW ============ */
document.getElementById('prev-month').addEventListener('click', ()=>{ monthOffset -= 1; renderOverview(); });
document.getElementById('next-month').addEventListener('click', ()=>{ monthOffset += 1; renderOverview(); });

document.getElementById('add-income-btn').addEventListener('click', ()=>{
  const amount = parseFloat(document.getElementById('income-amount').value);
  if(!amount || amount<=0) return;

document.getElementById('save-goal-btn').addEventListener('click', ()=>{

});

populateSelect();
loadEntries();
renderTrack();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ============ PULL TO REFRESH ============ */
(function(){
  let startY = 0;
  let pulling = false;
  const indicator = document.getElementById('pull-indicator');
  const THRESHOLD = 70;

  document.addEventListener('touchstart', (e)=>{
    if(window.scrollY === 0){
      startY = e.touches[0].clientY;
      pulling = true;
    } else {
      pulling = false;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e)=>{
    if(!pulling) return;
    const diff = e.touches[0].clientY - startY;
    if(diff > 0){
      const h = Math.min(diff * 0.5, 90);
      indicator.style.height = h + 'px';
      indicator.textContent = h > THRESHOLD ? '↑ Relâche pour rafraîchir' : '↓ Tire pour rafraîchir';
    }
  }, { passive: true });

  document.addEventListener('touchend', ()=>{
    if(!pulling) return;
    const h = parseInt(indicator.style.height) || 0;
    if(h > THRESHOLD){
      indicator.textContent = '⟳ Rafraîchissement...';
      indicator.style.height = '50px';
      setTimeout(()=>{
        loadEntries();
        renderTrack();
        indicator.style.height = '0px';
      }, 400);
    } else {
      indicator.style.height = '0px';
    }
    pulling = false;
  });
})();
